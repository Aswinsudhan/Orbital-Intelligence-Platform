kind = "web"
previewPath = "/"
title = "Orbital Intelligence Platform"
version = "1.0.0"
id = "artifacts/oip"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20204

[services.development]
run = "pnpm --filter @workspace/oip run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/oip", "run", "build" ]
publicDir = "artifacts/oip/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20204"
BASE_PATH = "/"
