<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1D"/>
      <stop offset="100%" stop-color="#070A14"/>
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Earth Globe Core -->
  <circle cx="256" cy="256" r="88" fill="url(#globeGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="88" fill="none" stroke="#60A5FA" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Primary Orbital Ring (Tilted Ellipse) -->
  <ellipse cx="256" cy="256" rx="185" ry="75" fill="none" stroke="url(#orbitGrad1)" stroke-width="12" transform="rotate(-30 256 256)" filter="url(#glow)" opacity="0.95"/>
  
  <!-- Secondary Orbital Ring (Cross Tilted Ellipse) -->
  <ellipse cx="256" cy="256" rx="185" ry="75" fill="none" stroke="url(#orbitGrad2)" stroke-width="8" transform="rotate(35 256 256)" stroke-dasharray="14 10" opacity="0.85"/>

  <!-- Satellite 1 on Primary Orbit -->
  <circle cx="395" cy="175" r="14" fill="#00F0FF" filter="url(#glow)"/>
  <circle cx="395" cy="175" r="7" fill="#FFFFFF"/>
  
  <!-- Satellite 2 on Secondary Orbit -->
  <circle cx="130" cy="210" r="10" fill="#10B981" filter="url(#glow)"/>
  <circle cx="130" cy="210" r="5" fill="#FFFFFF"/>

  <!-- Core Pulse Nodes -->
  <circle cx="256" cy="256" r="32" fill="#FFFFFF" opacity="0.15"/>
  <circle cx="256" cy="256" r="16" fill="#60A5FA"/>
</svg>
